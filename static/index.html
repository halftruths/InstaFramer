<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Framer</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar glass-panel">
            <header class="app-header">
                <h1>IG Framer</h1>
                <p>Granular control for photographers</p>
            </header>

            <div class="tabs">
                <button class="tab-btn active" data-tab="simple">Simple</button>
                <button class="tab-btn" data-tab="advanced">Advanced</button>
            </div>

            <div class="control-groups">
                <!-- Data Source -->
                <section class="control-group">
                    <h3>Source</h3>
                    <div class="file-browser-trigger" id="browse-btn" style="margin-bottom: 12px;">
                        <span>Select Local Image/Folder</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                            </path>
                        </svg>
                    </div>

                    <div class="amazon-input-wrapper">
                        <input type="text" id="amazon-url-input" class="glass-input"
                            placeholder="Paste Amazon Photos Share Link..." style="width: 100%;">
                        <button id="amazon-import-btn" class="secondary-btn glass-btn" style="margin-top: 8px;">Import
                            Amazon Photos</button>
                    </div>

                    <div id="selected-source-path" class="selected-path" title="No source selected..."
                        style="margin-top: 16px;">No source selected...</div>
                </section>

                <!-- Folder Gallery -->
                <section class="control-group folder-gallery-group" id="folder-gallery-group">
                    <h3>Folder Gallery</h3>
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Select an image to
                        preview:</p>
                    <div id="folder-image-list" class="folder-image-list">
                        <!-- populated via JS -->
                    </div>
                </section>

                <!-- Framing Controls -->
                <section class="control-group">
                    <h3>Framing Settings</h3>

                    <div class="input-row">
                        <label for="aspect-ratio">Instagram Canvas</label>
                        <select id="aspect-ratio" class="glass-input">
                            <option value="4:5">Portrait (4:5) [Max Size]</option>
                            <option value="1:1">Square (1:1)</option>
                            <option value="1.91:1">Landscape (1.91:1)</option>
                            <option value="original">Original Ratio (Just Resize)</option>
                        </select>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <label for="inner-border-width">Inner Border Width</label>
                            <span id="inner-border-val" class="slider-val">0px</span>
                        </div>
                        <input type="range" id="inner-border-width" min="0" max="200" value="0" class="glass-slider">

                        <div class="color-picker-row">
                            <label>Inner Color</label>
                            <input type="color" id="inner-border-color" value="#ffffff">
                            <input type="text" id="inner-border-hex" value="#ffffff" class="glass-input code-font"
                                size="7">
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <label for="outer-border-width">Outer Border Width</label>
                            <span id="outer-border-val" class="slider-val">0px</span>
                        </div>
                        <input type="range" id="outer-border-width" min="0" max="400" value="0" class="glass-slider">

                        <div class="color-picker-row advanced-only">
                            <label>Outer/Canvas Color</label>
                            <input type="color" id="outer-border-color" value="#000000">
                            <input type="text" id="outer-border-hex" value="#000000" class="glass-input code-font"
                                size="7">
                        </div>
                    </div>
                </section>

                <!-- Batch / Action Controls -->
                <section class="control-group actions-group">
                    <button id="batch-process-btn" class="primary-btn glass-btn" disabled>Batch Process Folder</button>
                    <div id="process-status" class="status-message"></div>
                </section>
            </div>
        </aside>

        <!-- Main Workspace (Preview) -->
        <main class="workspace">
            <div class="preview-container glass-panel">
                <div class="preview-header">
                    <h2>Live Preview</h2>
                    <span class="badge" id="preview-badge">Awaiting Image</span>
                </div>
                <div class="preview-area" id="preview-area">
                    <img id="live-preview-img" src="" alt="Live Preview" style="display:none;" />
                    <div id="preview-placeholder">
                        <div class="placeholder-icon">📷</div>
                        <p>Select an image to see framing preview</p>
                    </div>
                    <div id="loading-spinner" class="spinner" style="display:none;"></div>
                </div>
            </div>
        </main>

        <!-- File Browser Modal -->
        <div id="file-browser-modal" class="modal-overlay" style="display:none;">
            <div class="modal-content glass-panel">
                <div class="modal-header">
                    <h2>Select Image or Folder</h2>
                    <button class="close-btn" id="close-modal">&times;</button>
                </div>
                <div class="path-nav">
                    <button id="up-dir-btn" class="icon-btn" title="Up one directory">⬆️</button>
                    <input type="text" id="current-path-input" class="glass-input" readonly>
                </div>
                <div class="file-list" id="file-list">
                    <!-- dynamically populated -->
                </div>
                <div class="modal-footer">
                    <button id="select-folder-btn" class="secondary-btn glass-btn">Use Current Folder</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/static/app.js"></script>
</body>

</html>
